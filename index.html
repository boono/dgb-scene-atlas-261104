造、画图、机甲试制只指定风格化画面，过去的空间不可自动当成村内铁匠铺。","scene_ids":["general_13"]},{"document_id":"general_script","issue":"想象授血、想象战场及书中现世骚乱都有画面要求却未定背景；作为未定位展示分列，不臆定地点。","scene_ids":["general_15","general_16","general_17"]},{"document_id":"general_script","issue":"1-2村口先遣队战场与4-8村庄外终局战场可否同一地形复用未明确。","scene_ids":["general_03","general_19"]},{"document_id":"gloomy_man_script","question":"第二集水下冰窟和第四集归墟冰窟是否同一地点？","evidence_leaves":[204,206,337,368],"handling":"暂分列，明确标为可评估合并，未把水下／地下关系擅自解释。"},{"document_id":"gloomy_man_script","question":"一比一复原旧宅的卧房，是否等同女主各场卧房？","evidence_leaves":[97,120,161,224],"handling":"基于女主连续居住、画像、铜镜和睡梦醒来关系工作归组，保留布局确认；地上旧金宅婚礼空间仍分列。"},{"document_id":"gloomy_man_script","question":"第四集4-2仅写金楼内，账本交接发生于哪间房？","evidence_leaves":[317,318],"handling":"已明确为金楼内，具体房间未定，不擅填书房／大厅；可评估复用现有空间。"},{"document_id":"gloomy_man_script","question":"两个4-5是否清稿后保留为祭台与冰窟两个空间？","evidence_leaves":[355,358,368],"handling":"按原文分别记录，不改编号或执行修改备注。"},{"document_id":"deity_script","question":"3-8广场、3-9教堂出口及4-6教堂外十字架之间的布局如何连接？","evidence_leaves":[384,400,492,494],"handling":"十字架及同一回放归为教堂外广场；出口围困处独立，不把所有教堂空间合成一个景。"},{"document_id":"deity_script","question":"4-2狼逃教堂后的落点和4-9完成任务处在哪里？","evidence_leaves":[428,429,528,529],"handling":"4-2只有起点可确认，沿教堂出口统计；4-9列未定位展示。"},{"document_id":"deity_script","question":"4-3原标日内但为废墟与小庭院；院落是否露天？","evidence_leaves":[431,432,437],"handling":"保留原场标内景口径及外观／入口待定，不静默改场标。"},{"document_id":"deity_script","question":"奶茶店、蛋糕店和正文咖啡店是否同一家？","evidence_leaves":[136,170,173],"handling":"奶茶店独立；2-6蛋糕店／咖啡店为同场异名，归一条并保留原称。"},{"document_id":"deity_script","question":"花树前世与废墟当下是否同一具体地点？","evidence_leaves":[37,416,426,451,506],"handling":"按同名树与恢复从前的视觉呼应归时态版本；正式同址仍待设定确认。"},{"document_id":"deity_script","question":"两张参考图片的外星场景是否出现在剧情？","evidence_leaves":[412,413],"handling":"没有剧情动作或场标，属于参照图片，未列为实际场景。"}]}</script>
<script>
(function(){
"use strict";
var root=document.getElementById("scene-atlas");
var data=JSON.parse(document.getElementById("atlas-data").textContent);
var scenes=data.scenes,summary=data.summary,occurrences=data.occurrences,segments=data.original_segments,issues=data.unresolved;
var byId=new Map(scenes.map(function(s){return [s.id,s]}));
var occById=new Map(occurrences.map(function(o){return [o.id,o]}));
var chapterNames=new Map(data.chapters.map(function(c){return [c.id,c.name]}));
var state={chapter:"all",status:"all",view:"catalogue",query:""};
var search=root.querySelector("#search"),dialog=document.getElementById("scene-dialog");
var statuses=[{key:"all",name:"全部"},{key:"明确展示",name:"明确展示"},{key:"未定位展示",name:"地点待补"},{key:"仅提及",name:"仅提及"},{key:"nonspatial",name:"非空间画面"}];
function esc(value){return String(value==null?"":value).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function groupName(s){return s.entry_kind!=="场景"?"非空间画面":s.status==="未定位展示"?"地点待补":s.status}
function cls(s){return s.entry_kind!=="场景"?"nonspatial":s.status==="明确展示"?"explicit":s.status==="未定位展示"?"unlocated":"mentioned"}
function badge(s){return '<span class="badge '+cls(s)+'">'+esc(groupName(s))+'</span>'}
function inChapter(s){return state.chapter==="all"||s.document_id===state.chapter}
function matchesStatus(s){return state.status==="all"||(state.status==="nonspatial"?s.entry_kind!=="场景":s.entry_kind==="场景"&&s.status===state.status)}
var searchText=new Map(scenes.map(function(s){return [s.id,[s.id,s.chapter,s.normalized_name,s.description,s.merge_notes,s.design_notes,s.art_direction,(s.raw_name||[]).join(" "),(s.scene_labels||[]).join(" "),(s.presentation||[]).join(" "),s.space_type,(s.periods||[]).join(" ")].join(" ").toLocaleLowerCase()]}));
function matchesQuery(s){var terms=state.query.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);var hay=searchText.get(s.id);return terms.every(function(t){return hay.includes(t)})}
function currentScenes(){return scenes.filter(function(s){return inChapter(s)&&matchesStatus(s)&&matchesQuery(s)})}
function readHash(){
var p=new URLSearchParams(location.hash.slice(1));
var ch=p.get("chapter"),st=p.get("status"),vw=p.get("view");
state.chapter=chapterNames.has(ch)?ch:"all";
state.status=statuses.some(function(s){return s.key===st})?st:"all";
state.view=["catalogue","segments","issues"].includes(vw)?vw:"catalogue";
state.query=p.get("q")||"";search.value=state.query;
}
function saveHash(){var p=new URLSearchParams();if(state.chapter!=="all")p.set("chapter",state.chapter);if(state.status!=="all")p.set("status",state.status);if(state.view!=="catalogue")p.set("view",state.view);if(state.query)p.set("q",state.query);try{history.replaceState(null,"",location.pathname+location.search+(p.toString()?"#"+p.toString():""))}catch(e){}}
function renderChart(){
root.querySelector("#chapter-chart").innerHTML=summary.map(function(s){
var vals=[s.explicit_scene_count,s.unlocated_scene_count,s.mentioned_scene_count];
var keys=["明确展示","未定位展示","仅提及"],classes=["explicit","unlocated","mentioned"];
var label=s.chapter+"：明确展示"+vals[0]+"，地点待补"+vals[1]+"，仅提及"+vals[2]+"，合计"+s.scene_requirement_count+"条";
return '<button type="button" class="chapter-row" data-chapter="'+s.document_id+'" aria-pressed="'+(state.chapter===s.document_id)+'" aria-label="'+esc(label)+'"><span class="chapter-name">'+esc(s.chapter)+'</span><span class="bar-track">'+vals.map(function(n,i){return n?'<span class="bar-part '+classes[i]+'" data-status="'+keys[i]+'" style="width:'+(n/40*100)+'%" title="'+esc(keys[i]+" "+n+"条")+'">'+(n>=3?n:"")+'</span>':""}).join("")+'</span><span class="chapter-total">'+s.scene_requirement_count+'</span></button>'
}).join("");
}
function renderFilters(){
var scoped=scenes.filter(inChapter);
root.querySelector("#status-filters").innerHTML=statuses.map(function(st){
var n=scoped.filter(function(s){return st.key==="all"||(st.key==="nonspatial"?s.entry_kind!=="场景":s.entry_kind==="场景"&&s.status===st.key)}).length;
return '<button class="filter" type="button" data-status-filter="'+st.key+'" aria-pressed="'+(state.status===st.key)+'">'+esc(st.name)+'<small>'+n+'</small></button>'
}).join("");
}
function card(s){
var periods=s.periods.length?s.periods.join("、"):"未明确";
var forms=s.presentation.length?s.presentation.join(" · "):"表现未明确";
return '<button type="button" class="scene-card" data-scene="'+s.id+'" aria-label="'+esc(s.id+" "+s.normalized_name+"，"+groupName(s)+"，查看详情")+'"><span class="card-top"><span class="scene-id">'+s.id+' · '+esc(s.chapter)+'</span>'+badge(s)+'</span><span class="scene-name">'+esc(s.normalized_name)+'</span><span class="scene-meta"><span>'+esc(s.space_type)+'</span><span>'+esc(periods)+'</span><span>'+esc(forms)+'</span></span><span class="scene-labels">'+esc(s.scene_labels.join("；"))+'</span><span class="print-detail"><p>'+esc(s.description)+'</p>'+(s.merge_notes?'<p>归并：'+esc(s.merge_notes)+'</p>':"")+'<p>设计：'+esc(s.design_notes)+'</p><p>美术：'+esc(s.art_direction)+'</p></span></button>'
}
function sceneLink(id){var s=byId.get(id);return s?'<button class="scene-link" type="button" data-scene="'+id+'"><span class="scene-id">'+id+'</span>'+esc(s.normalized_name)+'</button>':""}
function renderCatalogue(){
var rows=currentScenes(),spatial=rows.filter(function(s){return s.entry_kind==="场景"}).length;
root.querySelector("#scene-cards").innerHTML=rows.length?rows.map(card).join(""):'<p class="empty">没有符合当前条件的场景。</p>';
root.querySelector("#result-count").textContent="显示 "+rows.length+" 条 · 场景需求 "+spatial+" 条"+(rows.length>spatial?" + 非空间画面 "+(rows.length-spatial)+" 条":"");
root.querySelector("#result-note").textContent="点击场景查看剧情、美术、归并说明和原文证据";
}
function renderSegments(){
var allowed=new Set(currentScenes().map(function(s){return s.id}));
var original=segments.filter(function(seg){return (state.chapter==="all"||seg.document_id===state.chapter)&&seg.scene_ids.some(function(id){return allowed.has(id)})});
var html=original.map(function(seg){var ids=seg.scene_ids.filter(function(id){return allowed.has(id)});return '<details class="segment"><summary><span class="badge">'+esc(seg.chapter)+'</span><span class="original-header">'+esc(seg.original_header)+'</span><span class="segment-summary">'+ids.length+' 条关联 · 原文块 '+seg.source_leaf_start+'</span></summary><div class="scene-links">'+ids.map(sceneLink).join("")+'</div></details>'}).join("");
var outlineCount=0;
summary.filter(function(s){return s.original_segment_count===0&&(state.chapter==="all"||s.document_id===state.chapter)}).forEach(function(ch){
var chScenes=scenes.filter(function(s){return s.document_id===ch.document_id&&allowed.has(s.id)}),groups=new Map();
chScenes.forEach(function(s){s.scene_labels.forEach(function(label){if(!groups.has(label))groups.set(label,[]);groups.get(label).push(s.id)})});
if(!groups.size)return;
html+='<h3 class="outline-heading">'+esc(ch.chapter)+' · 大纲事件</h3><p class="hint">原文未给分场号，保留事件定位。</p>';
groups.forEach(function(ids,label){outlineCount++;html+='<details class="segment"><summary><span class="original-header">'+esc(label)+'</span><span class="segment-summary">'+ids.length+' 条关联</span></summary><div class="scene-links">'+ids.map(sceneLink).join("")+'</div></details>'});
});
root.querySelector("#segment-list").innerHTML=html||'<p class="empty">没有符合当前条件的原场关联。</p>';
root.querySelector("#result-count").textContent="覆盖原分场 "+original.length+" / 150"+(outlineCount?" · 另列 "+outlineCount+" 组大纲事件":"");
root.querySelector("#result-note").textContent="同号分场按原文位置区分；关联数量不是镜头数";
}
function renderIssues(){
var terms=state.query.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);
var rows=issues.filter(function(i){return (state.chapter==="all"||i.document_id===state.chapter)&&terms.every(function(t){return [chapterNames.get(i.document_id),i.issue||i.question,i.handling||""].join(" ").toLocaleLowerCase().includes(t)})});
root.querySelector("#issue-list").innerHTML=rows.length?rows.map(function(i){return '<article class="issue-row"><span class="issue-chapter">'+esc(chapterNames.get(i.document_id)||"跨篇")+'</span><div><p class="issue-question">'+esc(i.issue||i.question)+'</p>'+(i.handling?'<p class="issue-handling">当前处理：'+esc(i.handling)+'</p>':'<p class="issue-handling">保留现有场景归组，具体限制见对应条目设计／归并说明。</p>')+'</div></article>'}).join(""):'<p class="empty">没有符合当前条件的待确认关系。</p>';
root.querySelector("#result-count").textContent="显示 "+rows.length+" / "+issues.length+" 条待确认关系";
root.querySelector("#result-note").textContent="保留原文疑点与当前归组口径";
}
function render(){
renderChart();renderFilters();
root.querySelector("#scope-title").textContent=state.chapter==="all"?"全部篇章":chapterNames.get(state.chapter)+"篇";
root.querySelector("#show-all").hidden=state.chapter==="all";
var s=summary.find(function(ch){return ch.document_id===state.chapter});
root.querySelector("#scope-note").textContent=s?(s.original_segment_count?"原分场 "+s.original_segment_count+" 场":"大纲 · 无原分场号"):"";
root.querySelectorAll("[data-view]").forEach(function(b){b.setAttribute("aria-selected",String(state.view===b.dataset.view))});
["catalogue","segments","issues"].forEach(function(view){root.querySelector("#panel-"+view).hidden=state.view!==view});
root.querySelector("#status-filters").hidden=state.view==="issues";
search.placeholder=state.view==="issues"?"搜索待确认的地点关系，如：冰窟、教堂、复用":"搜索地点、剧情、设计备注或场号，如：教堂、冰窟、4-5";
if(state.view==="catalogue")renderCatalogue();else if(state.view==="segments")renderSegments();else renderIssues();
}
function section(label,content){return content?'<section class="detail-section"><div class="detail-label">'+esc(label)+'</div><p>'+esc(content)+'</p></section>':""}
function openScene(id){
var s=byId.get(id);if(!s)return;
document.getElementById("dialog-kicker").textContent=s.chapter+" ／ "+s.id;
document.getElementById("dialog-title").textContent=s.normalized_name;
var occ=s.occurrence_ids.map(function(id){return occById.get(id)}).filter(Boolean);
var note=s.entry_kind!=="场景"?"纯画面需求，单列且不计入地点数。":s.status==="未定位展示"?"剧情要求出现画面，但具体地点尚未落实；可能还需继续拆分。":s.status==="仅提及"?"仅有台词或结果提及，当前没有明确展示此地点。":"“明确展示”指剧情已要求该空间画面，不代表设计已定稿。";
var html='<div class="dialog-note">'+note+'</div><div class="detail-tags">'+badge(s)+'<span>'+esc(s.space_type)+'</span><span>'+esc(s.periods.join("、"))+'</span><span>'+esc(s.presentation.join(" · ")||"表现未明确")+'</span></div>';
html+=section("原集场／事件",s.scene_labels.join("；"))+section("剧情内容",s.description)+section("美术要求",s.art_direction)+section("归并说明",s.merge_notes)+section("设计说明与待确认",s.design_notes)+section("原文名称",s.raw_name.join(" ／ "));
html+='<section class="detail-section"><div class="detail-label">原文证据 · '+occ.length+' 条来源关联</div>';
html+=occ.map(function(o){var url=/^https:\/\/[^ ]+$/.test(o.source_url||"")?o.source_url:"";return '<div class="evidence"><div class="evidence-meta"><span>'+esc(o.original_header||o.event_label||o.scene_no||"大纲事件")+'</span><span>原文块 '+esc(o.source_leaf_start)+(o.source_leaf_end!==o.source_leaf_start?"–"+esc(o.source_leaf_end):"")+'</span><span>'+esc(o.occurrence_status||"")+'</span>'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">飞书原文 ↗</a>':"")+'</div><blockquote>'+esc(o.exact_evidence)+'</blockquote>'+(o.context?'<p class="evidence-context">'+esc(o.context)+'</p>':"")+'</div>'}).join("");
html+='</section><p class="source-caption">来源关联为有证据的场段／事件记录，不等同于镜头或剪辑出场次数。飞书链接跳转至来源文档，块号用于文内定位。</p>';
document.getElementById("dialog-content").innerHTML=html;
if(!dialog.open)dialog.showModal();
dialog.scrollTop=0;
}
root.addEventListener("click",function(e){
var chapter=e.target.closest("[data-chapter]");
if(chapter){state.chapter=chapter.dataset.chapter;var part=e.target.closest("[data-status]");state.status=part?part.dataset.status:"all";state.view="catalogue";state.query="";search.value="";render();saveHash();return}
var filter=e.target.closest("[data-status-filter]");if(filter){state.status=filter.dataset.statusFilter;render();saveHash();return}
var view=e.target.closest("[data-view]");if(view){state.view=view.dataset.view;render();saveHash();return}
var cardEl=e.target.closest("[data-scene]");if(cardEl){openScene(cardEl.dataset.scene)}
});
root.querySelector("#show-all").addEventListener("click",function(){state.chapter="all";state.status="all";state.query="";search.value="";render();saveHash()});
search.addEventListener("input",function(){state.query=search.value;if(state.view==="catalogue")renderCatalogue();else if(state.view==="segments")renderSegments();else renderIssues();saveHash()});
root.querySelector("#print-button").addEventListener("click",function(){window.print()});
document.getElementById("dialog-close").addEventListener("click",function(){dialog.close()});
dialog.addEventListener("click",function(e){if(e.target===dialog){var b=dialog.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)dialog.close()}});
root.querySelectorAll('[role="tab"]').forEach(function(tab){tab.addEventListener("keydown",function(e){if(!["ArrowLeft","ArrowRight","Home","End"].includes(e.key))return;e.preventDefault();var tabs=Array.from(root.querySelectorAll('[role="tab"]'));var index=tabs.indexOf(tab);var next=e.key==="Home"?0:e.key==="End"?tabs.length-1:(index+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;tabs[next].focus();tabs[next].click()})});
window.addEventListener("hashchange",function(){readHash();render()});
root.querySelector("#counting-rules").innerHTML=data.counting_rules.map(function(rule){return "<li>"+esc(rule)+"</li>"}).join("");
root.querySelector("#issue-total").textContent=issues.length;
readHash();render();
})();
</script>
</body>
</html>
